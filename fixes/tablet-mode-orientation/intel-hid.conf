# Enable SW_TABLET_MODE reporting on this convertible.
# The intel_hid module (ACPI INTC1070) can expose a tablet-mode switch via an
# input device called "Intel HID switches", but it is disabled by default.
# Value 2 ("at-probe") enables it at module load. This device has no VBTN/
# INT33D6 device, so intel_hid is the only working method here.
options intel_hid enable_sw_tablet_mode=2
